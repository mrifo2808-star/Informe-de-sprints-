<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeLearn Innovatia — Seguimiento de Sprints</title>
<style>
  :root{
    --navy:#0f2a4a; --navy2:#16345c; --blue:#2b6cb0; --celeste:#4299e1; --celestebg:#ebf8ff;
    --border:#cbd5e0; --text:#1a202c; --muted:#718096; --bg:#f4f7fb; --card:#ffffff;
    --green:#2f855a; --greenbg:#e6f6ee; --red:#c53030; --redbg:#fdecec;
    --gray:#718096; --graybg:#eef1f5; --amber:#b9810d; --amberbg:#fff6e5;
    --radius:8px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4}
  .wrap{max-width:1240px;margin:0 auto;padding:16px}

  .hdr{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--radius);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(15,42,74,.25)}
  .hdr-title{display:flex;align-items:center;gap:12px}
  .hdr-logo{width:38px;height:38px;border-radius:8px;background:var(--celeste);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .hdr h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
  .hdr-sub{font-size:11.5px;color:#bcd7f0;text-transform:uppercase;letter-spacing:.6px}
  .hdr-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sprint-badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .hbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .hbtn:hover{background:rgba(255,255,255,.22)}

  .controls{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .controls label{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
  .controls select{flex:1;min-width:220px;max-width:360px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;color:var(--text);background:#fff}
  .conn-status{margin-left:auto;font-size:12px;color:var(--muted)}
  .conn-status.ok{color:var(--green);font-weight:600}

  .summary{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .kpi .val{font-size:24px;font-weight:800;color:var(--navy);margin-top:4px}
  .kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .kpi.accent{border-left:4px solid var(--celeste)}
  .kpi.accent-green{border-left:4px solid var(--green)}

  .loading{margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--celeste);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .state{margin-top:40px;text-align:center;color:var(--muted);font-size:13.5px;padding:30px}

  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .badge-active{background:var(--celestebg);color:var(--blue)}
  .badge-completed{background:var(--greenbg);color:var(--green)}
  .badge-deferred{background:var(--graybg);color:var(--gray)}
  .badge-cancelled{background:var(--redbg);color:var(--red)}
  .badge-backlog{background:var(--graybg);color:var(--gray)}

  .table-wrap{margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .table-scroll{overflow-x:auto}
  table.task-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
  table.task-table thead th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;position:sticky;top:0;z-index:1}
  table.task-table tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  table.task-table tbody tr:hover{background:var(--celestebg)}
  table.task-table tbody tr:last-child td{border-bottom:none}
  .col-num{color:var(--muted);width:34px}
  .task-link{color:var(--blue);text-decoration:none;font-weight:600}
  .task-link:hover{text-decoration:underline}
  .task-title-plain{font-weight:600;color:var(--text)}
  .col-effort{font-weight:700;color:var(--navy);white-space:nowrap}
  .col-due{white-space:nowrap}
  .col-due.overdue{color:var(--red);font-weight:700}
  .col-due.backlog-tag{color:var(--muted);font-style:italic}

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(15,42,74,.55);align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:var(--radius);width:100%;max-width:420px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .modal-hdr{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 18px;font-weight:700;font-size:14px}
  .modal-body{padding:18px}
  .token-note{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0 0 12px;background:#f8fafc;padding:10px 12px;border-radius:6px;border-left:3px solid var(--celeste)}
  .token-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;margin-bottom:10px}
  .modal-status{min-height:18px;font-size:12px;margin-bottom:10px}
  .modal-status.err{color:var(--red)}
  .modal-status.ok{color:var(--green)}
  .btn{width:100%;padding:10px;border-radius:6px;border:1px solid var(--celeste);background:var(--celeste);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer}
  .btn:hover{background:#3182ce}

  .sprint-block{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .sprint-nav{display:flex;align-items:center;gap:6px}
  .sprint-nav button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
  .sprint-nav button:hover{background:rgba(255,255,255,.22)}
  .sprint-nav button.current-btn{background:var(--celeste);border-color:var(--celeste)}
  .sprint-nav button.current-btn:hover{background:#3182ce}
  .sprint-jump{display:flex;align-items:center;gap:4px}
  .sprint-jump input{width:52px;padding:6px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:12px;text-align:center}
  .sprint-jump input::placeholder{color:#bcd7f0}
  .sprint-jump button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer}

  .section-title{font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin:24px 0 8px;display:flex;align-items:center;gap:8px}
  .section-title .n{background:var(--celestebg);color:var(--blue);border-radius:999px;padding:2px 9px;font-size:11px}

  .export-btn{background:var(--green);border:1px solid var(--green);color:#fff;border-radius:6px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .export-btn:hover{background:#276749}
  .export-btn:disabled{opacity:.5;cursor:not-allowed}

  .area-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .area-DI{background:#fefcbf;color:#744210}
  .area-Produccion{background:#eef1f5;color:#4a5568}
  .area-Soporte{background:#f3e8ff;color:#6b21a8}
  .area-Gestion{background:#ebf8ff;color:#2b6cb0}
  .area-Proveedor{background:#f0fff4;color:#276749}
  .area-DI-Senior{background:#fff5f5;color:#c53030}
  .area-Revisor{background:#fff5f5;color:#742a2a}
  .area-Docente{background:#ebf4ff;color:#1e3a8a}
  .area-Calidad{background:#e6fffa;color:#234e52}
  .area-other{background:#eef1f5;color:#718096}
  .controls-sep{width:1px;height:28px;background:var(--border);margin:0 4px}
  .sel-group{display:flex;align-items:center;gap:8px}

  @media (max-width:600px){
    .hdr{flex-direction:column;align-items:flex-start}
    .controls{flex-direction:column;align-items:stretch}
    .conn-status{margin-left:0}
    .controls select{max-width:none}
    .hdr-actions{width:100%}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hdr">
      <div class="hdr-title">
        <div class="hdr-logo">WI</div>
        <div>
          <h1>WeLearn Innovatia</h1>
          <div class="hdr-sub">Seguimiento de Sprints</div>
        </div>
      </div>
      <div class="hdr-actions">
        <div class="sprint-block">
          <div id="sprintBadge" class="sprint-badge">Sprint: —</div>
          <div class="sprint-nav">
            <button id="sprintPrevBtn" onclick="navigateSprint(-1)" title="Sprint anterior">‹ S—</button>
            <button id="sprintCurrentBtn" class="current-btn" onclick="goToCurrentSprint()" title="Volver al sprint actual">S— actual</button>
            <button id="sprintNextBtn" onclick="navigateSprint(1)" title="Sprint siguiente">S— ›</button>
          </div>
        </div>
        <div class="sprint-jump">
          <input type="number" id="sprintJumpInput" min="1" max="53" placeholder="Nº">
          <button onclick="jumpToSprint()">Ir</button>
        </div>
        <button id="refreshBtn" class="hbtn" onclick="refreshAll()" style="display:none">🔄 Actualizar</button>
        <button id="forgetBtn" class="hbtn" onclick="forgetToken()" style="display:none">Cerrar sesión</button>
      </div>
    </header>

    <div id="controls" class="controls" style="display:none">
      <div class="sel-group">
        <label for="areaSel">Área</label>
        <select id="areaSel" onchange="onAreaChange()">
          <option value="">Todas las áreas</option>
        </select>
      </div>
      <div class="controls-sep"></div>
      <div class="sel-group">
        <label for="personSel">Persona</label>
        <select id="personSel" onchange="onPersonChange()">
          <option value="">Selecciona una persona…</option>
        </select>
      </div>
      <button id="exportBtn" class="export-btn" onclick="exportExcel()" style="display:none" disabled>📥 Exportar a Excel</button>
      <span id="connStatus" class="conn-status"></span>
    </div>

    <div id="summary" class="summary" style="display:none"></div>

    <div id="loading" class="loading" style="display:none">
      <div class="spin"></div>
      <div id="loadingText">Cargando…</div>
    </div>

    <div id="content"></div>
  </div>

  <div class="modal-bg" id="authGate">
    <div class="modal">
      <div class="modal-hdr">🔑 Conectar con Wrike</div>
      <div class="modal-body">
        <p class="token-note">Ingresa tu token permanente de Wrike (Configuración → Apps &amp; Integraciones → API) para ver el seguimiento de sprints. El token se guarda solo en este navegador.</p>
        <input type="password" id="tokenInput" class="token-input" placeholder="Pega tu token aquí…" autocomplete="off" spellcheck="false">
        <div id="gateStatus" class="modal-status"></div>
        <button class="btn" onclick="connect()">Conectar</button>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// WeLearn Innovatia — Seguimiento de Sprints
// Regla de negocio: SOLO effortAllocation (esfuerzo planificado). Nunca
// timelogs/timeSpent. Las "HH reales" = effortAllocation de tareas Completed.
// ═══════════════════════════════════════════════════════════════════════════

const TOKEN_KEY = 'wrike_token';
let token = localStorage.getItem(TOKEN_KEY) || null;

const EXCLUDED_EMAILS = new Set([
  'colaborador@welearn.cl',
  'grace.porras+welearn@consulting.wrike.com'
]);

// 'status' y 'dates' NO van en fields — Wrike los devuelve siempre por defecto,
// y pedirlos explícitamente en el array `fields` causa HTTP 400 (confirmado
// contra la API real: ver commit que corrigió este bug).
// 'spaceId' se sacó de esta lista: confirmado contra datos reales que viene
// vacío en la práctica (62/62 tareas revisadas) — la atribución de espacio se
// resuelve subiendo por parentIds (ver resolveTaskSpaceAndFolder).
const TASK_FIELDS = ['effortAllocation', 'responsibleIds', 'parentIds', 'superTaskIds', 'customFields'];

// Campo custom "Área" (DropDown) — ID confirmado contra la API real
const AREA_CF_ID = 'IEAEK4SXJUAE2ECL';
// Campo custom "Tablero!" (Text) — código de proyecto/curso
const TABLERO_CF_ID = 'IEAEK4SXJUAEY2ZS';
// Valores posibles de Área (del campo DropDown en Wrike)
const AREA_VALUES = ['DI','Producción','Soporte','Gestión','Proveedor','DI Senior','Revisor','Docente','Calidad'];

let spaces = [];         // [{id,title}]
let spaceIdSet = new Set(); // Set de space ids — para saber cuándo un parentId ES un espacio
let contacts = [];       // personas activas filtradas
let folderInfoCache = new Map(); // folderId -> {title, parentIds, permalink}|null
let currentSprint = null;  // sprint REAL de hoy (para badges "Vencida"/"Sprint actual")
let selectedSprint = null; // sprint que se está navegando/viendo
let allActiveTasks = [];   // todas las tareas Active únicas (deduplicadas) de la persona seleccionada, con espacio/carpeta resueltos
let lastFetchStats = null; // {rawCount, uniqueCount, duplicatesRemoved} del último fetch — ver loadPersonTasks
let isLoading = false;
let selectedArea = '';     // '' = todas las áreas

// ── WRIKE FETCH ──────────────────────────────────────────────────────────
async function wrike(path, params = {}) {
  const url = new URL('https://www.wrike.com/api/v4' + path);
  Object.entries(params).forEach(([k, v]) => {
    if (v === undefined || v === null) return;
    url.searchParams.set(k, typeof v === 'object' ? JSON.stringify(v) : String(v));
  });
  const r = await fetch(url.toString(), { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function paginateAll(fetchPage) {
  let items = [];
  let nextPageToken = null;
  let pages = 0;
  do {
    const r = await fetchPage(nextPageToken);
    items = items.concat(r.data || []);
    nextPageToken = r.nextPageToken || null;
    pages++;
  } while (nextPageToken && pages < 50);
  return items;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ── AUTH GATE ────────────────────────────────────────────────────────────
function showGate() { document.getElementById('authGate').classList.add('show'); }
function hideGate() { document.getElementById('authGate').classList.remove('show'); }

function setGateStatus(msg, cls) {
  const el = document.getElementById('gateStatus');
  el.textContent = msg;
  el.className = 'modal-status ' + (cls || '');
}

function wrikeErrorMessage(e) {
  if (e.message.includes('401')) return 'Token inválido.';
  if (e.message.includes('Failed to fetch')) return 'No se pudo conectar con Wrike — revisa tu conexión a internet.';
  return e.message;
}

async function connect() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) { setGateStatus('Ingresa un token antes de conectar.', 'err'); return; }
  token = t;
  setGateStatus('⏳ Verificando…', '');
  try {
    const me = await wrike('/contacts', { me: true });
    const c = me.data && me.data[0];
    const name = c ? (c.firstName + ' ' + c.lastName) : 'Conectado';
    localStorage.setItem(TOKEN_KEY, token);
    document.getElementById('tokenInput').value = '';
    setGateStatus('✔ ' + name, 'ok');
    hideGate();
    await bootstrap();
  } catch (e) {
    token = null;
    setGateStatus('✖ ' + wrikeErrorMessage(e), 'err');
  }
}

function forgetToken() {
  localStorage.removeItem(TOKEN_KEY);
  token = null;
  spaces = []; spaceIdSet = new Set(); contacts = []; folderInfoCache = new Map(); allActiveTasks = [];
  selectedArea = '';
  document.getElementById('refreshBtn').style.display = 'none';
  document.getElementById('forgetBtn').style.display = 'none';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('content').innerHTML = '';
  document.getElementById('connStatus').textContent = '';
  showGate();
}

// ── SPRINT (martes → lunes) ─────────────────────────────────────────────
const DOW_ES = ['dom','lun','mar','mié','jue','vie','sáb'];
const DOW_ES_CAP = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MON_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtSprintDate(d) {
  return DOW_ES[d.getDay()] + ' ' + d.getDate() + ' ' + MON_ES[d.getMonth()];
}
// Sprint actual: martes más reciente (<= hoy) hasta el lunes siguiente (6 días después)
function computeCurrentSprint(now = new Date()) {
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = today.getDay(); // 0=Dom..6=Sáb
  const diffToTuesday = (dow - 2 + 7) % 7; // días desde el último martes
  const start = new Date(today); start.setDate(today.getDate() - diffToTuesday);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return { start, end };
}

// Número de semana ISO-8601 del martes de inicio del sprint (S34 = 18-24 ago 2026, etc.)
function isoWeekNumber(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const week1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}
// Inversa de isoWeekNumber: martes de la semana ISO `week` del año `year`.
function tuesdayOfIsoWeek(week, year) {
  const jan4 = new Date(year, 0, 4);
  const jan4Dow = (jan4.getDay() + 6) % 7; // lunes=0..domingo=6
  const week1Monday = new Date(jan4);
  week1Monday.setDate(jan4.getDate() - jan4Dow);
  const monday = new Date(week1Monday);
  monday.setDate(week1Monday.getDate() + (week - 1) * 7);
  const tuesday = new Date(monday);
  tuesday.setDate(monday.getDate() + 1);
  return tuesday;
}
function sprintFromTuesday(tue) {
  const start = new Date(tue.getFullYear(), tue.getMonth(), tue.getDate());
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return { start, end };
}
// "Sprint S34 — Mar 18/08 al Lun 24/08/2026"
function sprintLabel(sprint) {
  const w = isoWeekNumber(sprint.start);
  const dm = d => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
  const startTxt = DOW_ES_CAP[sprint.start.getDay()] + ' ' + dm(sprint.start);
  const endTxt = DOW_ES_CAP[sprint.end.getDay()] + ' ' + dm(sprint.end) + '/' + sprint.end.getFullYear();
  return 'Sprint S' + w + ' — ' + startTxt + ' al ' + endTxt;
}
function sprintWeekOf(offsetWeeks, base) {
  const d = new Date(base.start);
  d.setDate(d.getDate() + offsetWeeks * 7);
  return isoWeekNumber(d);
}

function refreshSprintNavUI() {
  document.getElementById('sprintBadge').textContent = sprintLabel(selectedSprint);
  document.getElementById('sprintPrevBtn').textContent = '‹ S' + sprintWeekOf(-1, selectedSprint);
  document.getElementById('sprintNextBtn').textContent = 'S' + sprintWeekOf(1, selectedSprint) + ' ›';
  const curBtn = document.getElementById('sprintCurrentBtn');
  curBtn.textContent = 'S' + isoWeekNumber(currentSprint.start) + ' actual';
  curBtn.classList.toggle('current-btn', ymd(selectedSprint.start) === ymd(currentSprint.start));
}

function updateSprintBadge() {
  currentSprint = computeCurrentSprint();
  if (!selectedSprint) selectedSprint = currentSprint;
  refreshSprintNavUI();
}

function navigateSprint(deltaWeeks) {
  const newStart = new Date(selectedSprint.start);
  newStart.setDate(newStart.getDate() + deltaWeeks * 7);
  selectedSprint = sprintFromTuesday(newStart);
  refreshSprintNavUI();
  renderFromCache();
}

function goToCurrentSprint() {
  selectedSprint = currentSprint;
  refreshSprintNavUI();
  renderFromCache();
}

function jumpToSprint() {
  const input = document.getElementById('sprintJumpInput');
  const w = parseInt(input.value, 10);
  if (!w || w < 1 || w > 53) return;
  // Siempre relativo al año REAL vigente (currentSprint), nunca al año del
  // sprint que se esté navegando — si no, tras un "S1" que cae en el año
  // anterior, un "S34" posterior heredaría ese año y desalinearía las fechas.
  const year = currentSprint.start.getFullYear();
  selectedSprint = sprintFromTuesday(tuesdayOfIsoWeek(w, year));
  input.value = '';
  refreshSprintNavUI();
  renderFromCache();
}

// ── CONTACTS ─────────────────────────────────────────────────────────────
function fullName(c) { return ((c.firstName || '') + ' ' + (c.lastName || '')).trim() || c.id; }

async function loadContacts() {
  const r = await wrike('/contacts');
  const list = (r.data || []).filter(c => {
    if (c.type !== 'Person') return false;
    if (c.deleted) return false;
    const emails = (c.profiles || []).map(p => (p.email || '').toLowerCase());
    if (emails.some(e => EXCLUDED_EMAILS.has(e))) return false;
    return true;
  });
  list.sort((a, b) => fullName(a).localeCompare(fullName(b), 'es'));
  return list;
}

function renderPersonSelect() {
  const sel = document.getElementById('personSel');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Selecciona una persona…</option>' +
    contacts.map(c => `<option value="${c.id}">${escapeHtml(fullName(c))}</option>`).join('');
  if (cur) sel.value = cur;
}

// ── SPACES ───────────────────────────────────────────────────────────────
async function loadSpaces() {
  const r = await wrike('/spaces');
  return (r.data || []).map(s => ({ id: s.id, title: s.title }));
}

// ── RESOLUCIÓN DE ESPACIO/CARPETA (cache) ──────────────────────────────────
// task.spaceId viene vacío en la práctica (confirmado: 62/62 tareas reales
// revisadas) — no sirve para agrupar. En cambio se sube por parentIds hasta
// encontrar un id que sea un espacio conocido (ver spaceIdSet), cacheando
// cada folder ({title, parentIds}) para no repetir llamadas.
async function resolveFoldersInfoBatch(ids) {
  const toFetch = [...new Set(ids)].filter(id => id && !folderInfoCache.has(id));
  for (let i = 0; i < toFetch.length; i += 100) {
    const chunk = toFetch.slice(i, i + 100);
    try {
      const r = await wrike('/folders/' + chunk.join(','));
      (r.data || []).forEach(f => folderInfoCache.set(f.id, {
        title: f.title,
        parentIds: f.parentIds || [],
        permalink: f.permalink || null
      }));
    } catch (e) { console.warn('resolveFoldersInfoBatch falló para', chunk, e); }
    chunk.forEach(id => { if (!folderInfoCache.has(id)) folderInfoCache.set(id, null); });
  }
}

// Sube la cadena de parentIds nivel por nivel (BFS acotado a 6 niveles),
// resolviendo cada nivel en batch, hasta que ya no queden folders nuevos por
// resolver — deja folderInfoCache listo para que resolveTaskSpaceAndFolder
// (síncrona) pueda recorrer la cadena de cada tarea sin más llamadas a Wrike.
async function resolveSpaceChains(tasks) {
  let frontier = [...new Set(tasks.map(t => t.parentIds && t.parentIds[0]).filter(Boolean))];
  for (let depth = 0; depth < 6 && frontier.length; depth++) {
    await resolveFoldersInfoBatch(frontier);
    const next = new Set();
    frontier.forEach(id => {
      if (spaceIdSet.has(id)) return; // ya es un espacio, no hace falta subir más
      const info = folderInfoCache.get(id);
      if (info && info.parentIds) info.parentIds.forEach(pid => { if (pid && !folderInfoCache.has(pid)) next.add(pid); });
    });
    frontier = [...next];
  }
}

function resolveTaskSpaceAndFolder(task) {
  const directParent = task.parentIds && task.parentIds[0];
  const info0 = directParent ? folderInfoCache.get(directParent) : null;
  // Si el directParent es ya un espacio, no hay carpeta intermedia
  const folderTitle = (info0 && !spaceIdSet.has(directParent)) ? info0.title : null;
  const folderPermalink = (info0 && !spaceIdSet.has(directParent)) ? info0.permalink : null;
  let cur = directParent, depth = 0;
  while (cur && depth < 6) {
    if (spaceIdSet.has(cur)) {
      const sp = spaces.find(s => s.id === cur);
      return { spaceTitle: sp ? sp.title : cur, folderTitle, folderPermalink };
    }
    const info = folderInfoCache.get(cur);
    if (!info || !info.parentIds || !info.parentIds.length) break;
    cur = info.parentIds[0];
    depth++;
  }
  return { spaceTitle: 'Otro / no identificado', folderTitle, folderPermalink: null };
}

// ── ÁREA (custom field) ────────────────────────────────────────────────────
function getTaskArea(task) {
  const cf = (task.customFields || []).find(f => f.id === AREA_CF_ID);
  return cf ? (cf.value || '') : '';
}
function getTaskTablero(task) {
  const cf = (task.customFields || []).find(f => f.id === TABLERO_CF_ID);
  return cf ? (cf.value || '') : '';
}
function areaCssClass(area) {
  const map = {
    'DI':'area-DI','Producción':'area-Produccion','Soporte':'area-Soporte',
    'Gestión':'area-Gestion','Proveedor':'area-Proveedor','DI Senior':'area-DI-Senior',
    'Revisor':'area-Revisor','Docente':'area-Docente','Calidad':'area-Calidad'
  };
  return map[area] || 'area-other';
}
function renderAreaSelect() {
  const sel = document.getElementById('areaSel');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todas las áreas</option>' +
    AREA_VALUES.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
  if (cur) sel.value = cur;
}
function onAreaChange() {
  selectedArea = document.getElementById('areaSel').value;
  renderFromCache();
}
// Tareas filtradas por área seleccionada (client-side)
function filteredByArea() {
  if (!selectedArea) return allActiveTasks;
  return allActiveTasks.filter(x => getTaskArea(x.task) === selectedArea);
}

// ── TODAS LAS TAREAS DE LA PERSONA (endpoint global, sin scope) ───────────
// Iterar espacio por espacio (/spaces/{id}/tasks) se probó y se descartó:
// verificado contra datos reales que pierde tareas activas genuinas cuando
// una carpeta es descendiente de más de un espacio (confirmado: 53 de 62
// tareas reales, un 14.5% perdido). El endpoint global /tasks sin scope,
// filtrado por responsibles, sí trae el universo completo — confirmado
// contra la misma cuenta real (62/62, estable en dos corridas).
async function fetchAllTasksForContact(contactId) {
  return paginateAll((nextPageToken) => {
    const params = {
      fields: TASK_FIELDS,
      responsibles: [contactId],
      pageSize: 1000
    };
    if (nextPageToken) params.nextPageToken = nextPageToken;
    return wrike('/tasks', params);
  });
}

function effortHours(task) {
  const min = task.effortAllocation && typeof task.effortAllocation.totalEffort === 'number'
    ? task.effortAllocation.totalEffort : 0;
  return min / 60;
}

const STATUS_LABEL = { Active: 'Activa', Completed: 'Completada', Deferred: 'Diferida', Cancelled: 'Cancelada' };
const STATUS_CLASS = { Active: 'badge-active', Completed: 'badge-completed', Deferred: 'badge-deferred', Cancelled: 'badge-cancelled' };

function fmtTaskDate(s) {
  if (!s) return '—';
  const d = new Date(s.slice(0, 10) + 'T00:00:00');
  return d.getDate() + ' ' + MON_ES[d.getMonth()];
}

// ── LOAD & RENDER ─────────────────────────────────────────────────────────
function showLoading(msg) {
  const l = document.getElementById('loading');
  if (msg) { l.style.display = 'flex'; document.getElementById('loadingText').textContent = msg; }
  else l.style.display = 'none';
}

async function onPersonChange() {
  const sel = document.getElementById('personSel');
  const contactId = sel.value;
  if (!contactId) {
    document.getElementById('summary').style.display = 'none';
    document.getElementById('content').innerHTML = '';
    document.getElementById('exportBtn').style.display = 'none';
    allActiveTasks = [];
    return;
  }
  await loadPersonTasks(contactId);
}

async function refreshAll() {
  if (isLoading) return;
  updateSprintBadge();
  const sel = document.getElementById('personSel');
  if (sel.value) await loadPersonTasks(sel.value);
}

// Trae TODAS las tareas Active de la persona (sin filtro de fecha) una sola
// vez; la navegación entre sprints después solo refiltra client-side (ver
// renderFromCache), sin volver a golpear la API.
async function loadPersonTasks(contactId) {
  if (isLoading) return;
  isLoading = true;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('content').innerHTML = '';
  document.getElementById('exportBtn').style.display = 'none';
  showLoading('Cargando tareas…');
  try {
    const raw = await fetchAllTasksForContact(contactId);
    const activeOnly = raw.filter(t => t.status === 'Active');
    // Dedup por task.id: la misma tarea puede volver más de una vez entre
    // páginas de una misma consulta. Se queda con la primera ocurrencia.
    const taskMap = new Map();
    activeOnly.forEach(t => { if (!taskMap.has(t.id)) taskMap.set(t.id, t); });
    const deduped = Array.from(taskMap.values());
    lastFetchStats = { rawCount: activeOnly.length, uniqueCount: deduped.length, duplicatesRemoved: activeOnly.length - deduped.length };
    console.log(`[Sprint Tracking] Tareas Active traídas: ${activeOnly.length} crudas → ${deduped.length} únicas (${lastFetchStats.duplicatesRemoved} duplicadas eliminadas)`);

    showLoading('Resolviendo espacios y carpetas…');
    await resolveSpaceChains(deduped);
    allActiveTasks = deduped.map(t => {
      const { spaceTitle, folderTitle, folderPermalink } = resolveTaskSpaceAndFolder(t);
      return { task: t, spaceTitle, folderTitle, folderPermalink };
    });

    document.getElementById('exportBtn').style.display = 'inline-flex';
    renderFromCache();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="state">✖ Error cargando tareas: ${escapeHtml(wrikeErrorMessage(e))}</div>`;
  } finally {
    isLoading = false;
    showLoading(false);
  }
}

// ── CLASIFICACIÓN POR SPRINT (client-side) ────────────────────────────────
// Dato real confirmado contra la API: gran parte de las tareas "Active" en
// esta cuenta tiene fechas Planned viejas (2023-2024) o es tipo Backlog (sin
// fecha) — casi nada cae en el sprint 2026 vigente. Por eso "Vencidas" es una
// sección SIEMPRE visible (no depende del sprint que se esté navegando):
// esconder ese universo detrás de "navega 100 sprints atrás para verlo"
// haría que la página se viera vacía/rota de nuevo sin serlo.
function taskDueYmd(t) {
  const due = t.dates && t.dates.due;
  return due ? due.slice(0, 10) : null;
}
function taskStartYmd(t) {
  const start = t.dates && t.dates.start;
  return start ? start.slice(0, 10) : null;
}
function isBacklogTask(t) {
  const d = t.dates || {};
  return d.type === 'Backlog' || !d.due;
}
function inSprintRange(ymdStr, sprint) {
  if (!ymdStr) return false;
  return ymdStr >= ymd(sprint.start) && ymdStr <= ymd(sprint.end);
}
// Reparte allActiveTasks en 3 baldes mutuamente excluyentes para el sprint
// que se esté navegando: backlog (sin fecha, siempre) / vencida (due < hoy,
// siempre) / sprint (due >= hoy y cae en el rango del sprint seleccionado).
function bucketize(tasks, sprint) {
  const todayStr = ymd(new Date());
  const backlog = [], overdue = [], sprintTasks = [];
  tasks.forEach(x => {
    if (isBacklogTask(x.task)) { backlog.push(x); return; }
    const due = taskDueYmd(x.task);
    if (due < todayStr) { overdue.push(x); return; }
    if (inSprintRange(due, sprint)) sprintTasks.push(x);
  });
  return { backlog, overdue, sprintTasks };
}

// Re-renderiza desde allActiveTasks (ya en memoria) para el selectedSprint
// actual — no hace ninguna llamada nueva a Wrike.
function renderFromCache() {
  if (!allActiveTasks.length) {
    document.getElementById('summary').style.display = 'none';
    document.getElementById('content').innerHTML = document.getElementById('personSel').value
      ? '<div class="state">Esta persona no tiene tareas activas asignadas en ningún espacio.</div>'
      : '';
    return;
  }
  const tasksForArea = filteredByArea();
  const { backlog, overdue, sprintTasks } = bucketize(tasksForArea, selectedSprint);
  renderSummary(sprintTasks, overdue, backlog);
  renderTaskSections(sprintTasks, overdue, backlog);
}

function renderSummary(sprintTasks, overdue, backlog) {
  const totalHours = sprintTasks.reduce((sum, x) => sum + effortHours(x.task), 0);
  const summaryEl = document.getElementById('summary');
  summaryEl.style.display = 'grid';
  summaryEl.innerHTML = `
    <div class="kpi accent">
      <div class="label">Tareas en ${escapeHtml('S' + isoWeekNumber(selectedSprint.start))}</div>
      <div class="val">${sprintTasks.length}</div>
      <div class="sub">con fecha en este sprint</div>
    </div>
    <div class="kpi accent">
      <div class="label">Horas del Sprint</div>
      <div class="val">${totalHours.toFixed(1)}</div>
      <div class="sub">effortAllocation total</div>
    </div>
    <div class="kpi" style="${overdue.length ? 'border-left:4px solid var(--red)' : ''}">
      <div class="label">Vencidas</div>
      <div class="val" style="${overdue.length ? 'color:var(--red)' : ''}">${overdue.length}</div>
      <div class="sub">dueDate anterior a hoy</div>
    </div>
    <div class="kpi accent-green">
      <div class="label">Backlog (sin fecha)</div>
      <div class="val">${backlog.length}</div>
      <div class="sub">independiente del sprint</div>
    </div>`;
}

function taskTableRow(x, i, sectionType) {
  const t = x.task;
  const hrs = effortHours(t).toFixed(1) + ' hrs';
  const statusCls = STATUS_CLASS[t.status] || 'badge-deferred';
  const statusLbl = STATUS_LABEL[t.status] || t.status || '—';
  const titleHtml = t.permalink
    ? `<a class="task-link" href="${escapeHtml(t.permalink)}" target="_blank" rel="noopener">${escapeHtml(t.title || '(sin título)')}</a>`
    : `<span class="task-title-plain">${escapeHtml(t.title || '(sin título)')}</span>`;

  // Folder: link clickeable si hay permalink
  const folderLabel = x.folderTitle || '—';
  const folderHtml = (x.folderTitle && x.folderPermalink)
    ? `<a class="task-link" href="${escapeHtml(x.folderPermalink)}" target="_blank" rel="noopener">${escapeHtml(x.folderTitle)}</a>`
    : (x.folderTitle ? escapeHtml(x.folderTitle) : '<span style="color:var(--muted)">—</span>');

  // Tablero (código de proyecto) — se muestra debajo del folder si existe
  const tablero = getTaskTablero(t);
  const folderCell = tablero
    ? `${folderHtml}<br><small style="color:var(--muted);font-size:10px">${escapeHtml(tablero)}</small>`
    : folderHtml;

  // Área badge
  const area = getTaskArea(t);
  const areaBadge = area
    ? `<span class="area-badge ${areaCssClass(area)}">${escapeHtml(area)}</span>`
    : '<span style="color:var(--muted);font-size:11px">—</span>';

  let dueCell;
  if (sectionType === 'backlog') {
    dueCell = '<span class="col-due backlog-tag">Backlog</span>';
  } else {
    const due = taskDueYmd(t);
    const cls = sectionType === 'overdue' ? 'col-due overdue' : 'col-due';
    dueCell = `<span class="${cls}">${fmtTaskDate(due)}</span>`;
  }
  return `<tr>
    <td class="col-num">${i + 1}</td>
    <td>${titleHtml}</td>
    <td>${escapeHtml(x.spaceTitle)}</td>
    <td>${folderCell}</td>
    <td>${areaBadge}</td>
    <td class="col-effort">${hrs}</td>
    <td><span class="badge ${statusCls}">${escapeHtml(statusLbl)}</span></td>
    <td>${dueCell}</td>
  </tr>`;
}

function taskTableHtml(entries, sectionType) {
  const sorted = [...entries].sort((a, b) => {
    if (sectionType === 'backlog') {
      return a.spaceTitle.localeCompare(b.spaceTitle, 'es') || (a.task.title || '').localeCompare(b.task.title || '', 'es');
    }
    return (taskDueYmd(a.task) || '').localeCompare(taskDueYmd(b.task) || '');
  });
  const rows = sorted.map((x, i) => taskTableRow(x, i, sectionType)).join('');
  return `
    <div class="table-wrap">
      <div class="table-scroll">
        <table class="task-table">
          <thead><tr>
            <th>#</th><th>Tarea</th><th>Espacio</th><th>Carpeta / Proyecto</th>
            <th>Área</th><th>Esfuerzo</th><th>Estado</th><th>Fecha término</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderTaskSections(sprintTasks, overdue, backlog) {
  const content = document.getElementById('content');
  const sprintTitle = sprintLabel(selectedSprint).replace('Sprint ', '');
  let html = '';
  html += `<div class="section-title">Sprint ${escapeHtml(sprintTitle)} <span class="n">${sprintTasks.length}</span></div>`;
  html += sprintTasks.length ? taskTableHtml(sprintTasks, 'sprint') : '<div class="state">Sin tareas con fecha en este sprint.</div>';
  html += `<div class="section-title">⚠ Vencidas <span class="n">${overdue.length}</span></div>`;
  html += overdue.length ? taskTableHtml(overdue, 'overdue') : '<div class="state">Sin tareas vencidas.</div>';
  html += `<div class="section-title">📋 Backlog / Sin fecha <span class="n">${backlog.length}</span></div>`;
  html += backlog.length ? taskTableHtml(backlog, 'backlog') : '<div class="state">Sin tareas backlog.</div>';
  content.innerHTML = html;
}

// ── EXPORTAR A EXCEL (SheetJS) ─────────────────────────────────────────────
function exportExcel() {
  if (typeof XLSX === 'undefined') {
    alert('No se pudo cargar la librería de Excel (revisa tu conexión a internet).');
    return;
  }
  const sel = document.getElementById('personSel');
  const personName = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : 'Persona';
  const todayStr = ymd(new Date());
  const weekLabel = 'S' + isoWeekNumber(selectedSprint.start);
  const tasksForArea = filteredByArea();
  const { backlog, overdue, sprintTasks } = bucketize(tasksForArea, selectedSprint);

  const rows = [];
  function pushRows(list, sprintCol) {
    list.forEach(x => {
      const t = x.task;
      rows.push({
        'Sprint': sprintCol,
        'Persona': personName,
        'Área': getTaskArea(t),
        'Nombre de tarea': t.title || '',
        'Espacio': x.spaceTitle,
        'Carpeta/Proyecto': x.folderTitle || '',
        'Código de proyecto': getTaskTablero(t),
        'Esfuerzo (hrs)': Number(effortHours(t).toFixed(1)),
        'Estado': STATUS_LABEL[t.status] || t.status || '',
        'Fecha inicio': taskStartYmd(t) || '',
        'Fecha término': taskDueYmd(t) || '',
        'URL Tarea': t.permalink || '',
        'URL Carpeta': x.folderPermalink || ''
      });
    });
  }
  pushRows(sprintTasks, weekLabel);
  pushRows(overdue, weekLabel + ' (vencida)');
  pushRows(backlog, 'Backlog');

  if (!rows.length) { alert('No hay tareas visibles para exportar.'); return; }

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sprint');
  const safeName = personName.replace(/\s+/g, '_').replace(/[\\/:*?"<>|]/g, '');
  XLSX.writeFile(wb, `Sprint_${weekLabel}_${safeName}_${todayStr}.xlsx`);
}

// ── BOOTSTRAP ────────────────────────────────────────────────────────────
async function bootstrap() {
  updateSprintBadge();
  document.getElementById('refreshBtn').style.display = 'inline-flex';
  document.getElementById('forgetBtn').style.display = 'inline-flex';
  document.getElementById('controls').style.display = 'flex';
  const status = document.getElementById('connStatus');
  status.textContent = 'Cargando personas y espacios…';
  status.className = 'conn-status';
  try {
    const [contactList, spaceList] = await Promise.all([loadContacts(), loadSpaces()]);
    contacts = contactList;
    spaces = spaceList;
    spaceIdSet = new Set(spaces.map(s => s.id));
    renderAreaSelect();
    renderPersonSelect();
    status.textContent = `✔ ${contacts.length} personas · ${spaces.length} espacios`;
    status.className = 'conn-status ok';
  } catch (e) {
    if (e.message.includes('401')) {
      forgetToken();
      setGateStatus('✖ Token inválido o expirado. Vuelve a conectar.', 'err');
      showGate();
      return;
    }
    status.textContent = '✖ ' + wrikeErrorMessage(e);
    status.className = 'conn-status';
  }
}

function init() {
  updateSprintBadge();
  if (!token) {
    showGate();
    return;
  }
  bootstrap();
}

init();
</script>
